name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Quill.slnx

      - name: Build
        run: dotnet build Quill.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Quill.slnx -c Release --no-build
